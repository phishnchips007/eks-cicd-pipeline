name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: eks-cicd-pipeline
  EKS_CLUSTER: ali-eks-cluster

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s/BUILD_COMMIT_SHA/${IMAGE_TAG}/" app.html
          sed -i "s/BUILD_TIMESTAMP/$(date -u '+%Y-%m-%d %H:%M UTC')/" app.html
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER }} \
            --region ${{ env.AWS_REGION }}

      - name: Deploy to EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/cicd-app \
            cicd-app=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --record || \
          kubectl create deployment cicd-app \
            --image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
	  kubectl apply -f service.yml

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/cicd-app
          kubectl get pods
          kubectl get svc
